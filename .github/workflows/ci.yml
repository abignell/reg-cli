name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: 22
      - name: corepack
        run: corepack enable
      - name: yarn
        run: yarn install --immutable
      - name: typecheck
        run: yarn run typecheck
      - name: lint and format
        run: yarn run check
      - name: test
        run: yarn run test
